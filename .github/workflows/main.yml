
name: KTD 3D ANALYZER v3.9.8 APK Derle

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-apk:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Java 17 ayarla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 ayarla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK kontrol et
        shell: bash
        run: |
          set -e
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_DIR" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Android proje yapisini kontrol et
        shell: bash
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          echo "Android proje dosyalari bulundu."

      - name: APK derle
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK dosyasini yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KTD-3D-ANALYZER-v3.9.8-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
